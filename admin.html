<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>管理後台｜Claw Lucky</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%80%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <main class="page-wrap">
    <section class="section">
      <div class="panel">
        <h1>管理後台（最小版）</h1>
        <p class="subscription-status-text">退款審核／確認、實體贈品出貨。每個動作皆由後端重新檢查管理員權限，並留下稽核紀錄。</p>
        <p class="subscription-status-text" id="adminAuthStatus"></p>
        <div id="adminContent" hidden>
          <div class="button-row">
            <button type="button" class="btn" id="refreshBtn">重新整理</button>
          </div>

          <h2 class="section-title">待審核退款申請</h2>
          <ul id="refundList" class="admin-list"></ul>

          <h2 class="section-title">待出貨實體贈品</h2>
          <ul id="giftList" class="admin-list"></ul>

          <h2 class="section-title">人工測試權益（桌布生成額度）</h2>
          <p class="subscription-status-text">僅授予站內桌布生成額度測試權益，不影響 PayPal 訂閱、不產生扣款、不授予贈品。到期自動失效。</p>
          <div class="button-row">
            <button type="button" class="btn" id="grantEntitlementBtn">授予人工測試權益</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=20261011-1"></script>
  <script src="./js/pages/admin.js?v=20261014-1"></script>
</body>
</html>
