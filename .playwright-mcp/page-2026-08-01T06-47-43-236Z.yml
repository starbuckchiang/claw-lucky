        - generic [ref=f11e99]: 小故事
        - paragraph [ref=f11e100]: 從前，有位總是把願望藏在心底的客人。她來到雜貨店，星光小靈輕輕地在她耳邊說：「勇敢地說出你的願望吧，我會悄悄地為你收集星光。」老闆娘我啊，看她心事重重，便送了她一個「幸運乒乓守護吊飾」，告訴她：「這吊飾就像你的願望守護者，每次觸碰，都是提醒願望正在悄悄實現的信號。」後來，她發現許多小小的期望真的開始實現，而那吊飾，也成了她勇敢追夢的證明。
